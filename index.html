<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Headband Tracker</title>
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-fullscreen">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #000; width: 100vw; height: 100vh; overflow: hidden; }
    .container { position: relative; width: 100%; height: 100%; }
    video { 
      position: absolute; top: 0; left: 0; 
      width: 100%; height: 100%; 
      object-fit: cover;
    }
    canvas { 
      position: absolute; top: 0; left: 0; 
      width: 100%; height: 100%;
    }
    #status {
      color: white; font-family: sans-serif; font-size: 14px;
      padding: 8px 12px; position: fixed; top: 0; left: 0;
      background: rgba(0,0,0,0.7); width: 100%; 
      text-align: center; z-index: 10;
    }
    #controls {
      position: fixed; bottom: 20px; left: 50%; 
      transform: translateX(-50%);
      display: flex; gap: 12px; z-index: 10;
    }
    .btn {
      padding: 10px 20px; border: 2px solid white; border-radius: 20px;
      background: rgba(0,0,0,0.6); color: white; font-family: sans-serif;
      font-size: 14px; cursor: pointer;
    }
    .btn.active { background: white; color: black; }
  </style>
</head>
<body>
  <div id="status">Starting...</div>
  <div class="container">
    <video id="video" autoplay playsinline></video>
    <canvas id="canvas"></canvas>
  </div>
  <div id="controls">
    <button class="btn" id="btn-normal" onclick="switchLens('normal')">Normal</button>
    <button class="btn active" id="btn-ultrawide" onclick="switchLens('ultrawide')">Ultrawide</button>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@4.11.0/dist/tf.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/pose-detection@2.1.3/dist/pose-detection.min.js"></script>
  <script>
    const video = document.getElementById('video');
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    const statusEl = document.getElementById('status');

    let detector = null;
    let currentStream = null;
    let isDetecting = false;

    function resizeCanvas() {
      canvas.width = canvas.offsetWidth;
      canvas.height = canvas.offsetHeight;
    }

    window.addEventListener('resize', () => setTimeout(resizeCanvas, 300));

    // Calculate cover dimensions — same as CSS object-fit: cover
    // This makes skeleton coordinates match exactly what's visible on screen
    function getCoverDimensions() {
      const screenW = canvas.width;
      const screenH = canvas.height;
      const videoW = video.videoWidth;
      const videoH = video.videoHeight;

      const screenRatio = screenW / screenH;
      const videoRatio = videoW / videoH;

      let drawW, drawH, offsetX, offsetY;

      if (screenRatio > videoRatio) {
        // Screen is wider than video — fit width, crop top/bottom
        drawW = screenW;
        drawH = screenW / videoRatio;
        offsetX = 0;
        offsetY = (screenH - drawH) / 2;
      } else {
        // Screen is taller than video — fit height, crop left/right
        drawH = screenH;
        drawW = screenH * videoRatio;
        offsetX = (screenW - drawW) / 2;
        offsetY = 0;
      }

      return { drawW, drawH, offsetX, offsetY };
    }

    async function startCamera(lens) {
      isDetecting = false;

      if (currentStream) {
        currentStream.getTracks().forEach(t => t.stop());
        currentStream = null;
      }

      ctx.clearRect(0, 0, canvas.width, canvas.height);

      const constraints = {
        audio: false,
        video: {
          facingMode: 'environment',
          width: { ideal: 1280 },
          height: { ideal: 720 }
        }
      };

      try {
        const stream = await navigator.mediaDevices.getUserMedia(constraints);
        currentStream = stream;
        video.srcObject = stream;

        await new Promise(resolve => video.onloadedmetadata = resolve);
        await new Promise(resolve => {
          if (video.readyState >= 2) resolve();
          else video.oncanplay = resolve;
        });
        await video.play();
        resizeCanvas();

        if (lens === 'ultrawide') {
          const track = stream.getVideoTracks()[0];
          const capabilities = track.getCapabilities();
          if (capabilities.zoom) {
            await track.applyConstraints({ 
              advanced: [{ zoom: capabilities.zoom.min }] 
            });
            statusEl.textContent = 'Ultrawide active';
          } else {
            statusEl.textContent = 'Ultrawide not supported on this browser';
          }
        } else {
          statusEl.textContent = 'Running — point at people';
        }

        isDetecting = true;
        detect();

      } catch (err) {
        statusEl.textContent = 'Camera error: ' + err.message;
        statusEl.style.background = 'darkred';
      }
    }

    async function switchLens(lens) {
      document.getElementById('btn-normal').classList.toggle('active', lens === 'normal');
      document.getElementById('btn-ultrawide').classList.toggle('active', lens === 'ultrawide');
      statusEl.textContent = 'Switching lens...';
      await startCamera(lens);
    }

    async function setup() {
      try {
        statusEl.textContent = 'Requesting camera...';
        await startCamera('ultrawide');

        statusEl.textContent = 'Loading pose model...';
        detector = await poseDetection.createDetector(
          poseDetection.SupportedModels.MoveNet,
          { 
            modelType: poseDetection.movenet.modelType.MULTIPOSE_LIGHTNING,
            enableTracking: true,
            trackerType: poseDetection.TrackerType.BoundingBox
          }
        );

        statusEl.textContent = 'Running — point at people';

      } catch (err) {
        statusEl.textContent = 'Setup error: ' + err.message;
        statusEl.style.background = 'darkred';
      }
    }

    async function detect() {
      if (!isDetecting) return;

      requestAnimationFrame(async () => {
        if (!isDetecting) return;

        if (detector && video.readyState === 4) {
          try {
            const poses = await detector.estimatePoses(video);
            
            // Draw video using cover dimensions — no stretch
            const { drawW, drawH, offsetX, offsetY } = getCoverDimensions();
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            ctx.drawImage(video, offsetX, offsetY, drawW, drawH);

            for (const pose of poses) {
              drawSkeleton(pose.keypoints, offsetX, offsetY, drawW, drawH);
            }

            statusEl.textContent = `Running — ${poses.length} person${poses.length !== 1 ? 's' : ''} detected`;

          } catch(e) {
            // skip bad frames
          }
        }

        if (isDetecting) detect();
      });
    }

    function drawSkeleton(keypoints, offsetX, offsetY, drawW, drawH) {
      // Scale keypoints to match the cover-fitted video on screen
      const scaleX = drawW / video.videoWidth;
      const scaleY = drawH / video.videoHeight;

      function x(kp) { return kp.x * scaleX + offsetX; }
      function y(kp) { return kp.y * scaleY + offsetY; }

      const connections = [
        ['left_shoulder', 'right_shoulder'],
        ['left_shoulder', 'left_elbow'], ['left_elbow', 'left_wrist'],
        ['right_shoulder', 'right_elbow'], ['right_elbow', 'right_wrist'],
        ['left_shoulder', 'left_hip'], ['right_shoulder', 'right_hip'],
        ['left_hip', 'right_hip'],
        ['left_hip', 'left_knee'], ['left_knee', 'left_ankle'],
        ['right_hip', 'right_knee'], ['right_knee', 'right_ankle']
      ];

      const kpMap = {};
      for (const kp of keypoints) kpMap[kp.name] = kp;

      // Draw lines
      ctx.strokeStyle = 'lime';
      ctx.lineWidth = 2;
      for (const [a, b] of connections) {
        const kpA = kpMap[a], kpB = kpMap[b];
        if (kpA?.score > 0.3 && kpB?.score > 0.3) {
          ctx.beginPath();
          ctx.moveTo(x(kpA), y(kpA));
          ctx.lineTo(x(kpB), y(kpB));
          ctx.stroke();
        }
      }

      // Draw dots
      for (const kp of keypoints) {
        if (kp.score > 0.3) {
          ctx.beginPath();
          ctx.arc(x(kp), y(kp), 6, 0, 2 * Math.PI);
          ctx.fillStyle = ['nose','left_eye','right_eye','left_ear','right_ear']
            .includes(kp.name) ? 'red' : 'lime';
          ctx.fill();
        }
      }
    }

    setup();
  </script>
</body>
</html>
