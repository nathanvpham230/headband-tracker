<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Headband Tracker</title>
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: #000; color: #fff; font-family: Arial, sans-serif; }
    #app { position: fixed; inset: 0; background: #000; }
    video, canvas { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
    #status {
      position: fixed; top: env(safe-area-inset-top, 0); left: 0; right: 0; z-index: 20;
      padding: 8px 46px 8px 10px; background: rgba(0,0,0,.65); color: #fff;
      font-size: 13px; text-align: center; line-height: 1.25;
    }
    #drawerTab {
      position: fixed; top: 50%; right: 0; transform: translateY(-50%); z-index: 40;
      width: 34px; height: 74px; border: 1px solid rgba(255,255,255,.28); border-right: none;
      border-radius: 14px 0 0 14px; background: rgba(45,108,223,.95); color: #fff;
      display: flex; align-items: center; justify-content: center; font-size: 24px; font-weight: 700;
      cursor: pointer; user-select: none;
    }
    #drawer {
      position: fixed; top: 0; right: 0; bottom: 0; z-index: 35;
      width: min(330px, 86vw); padding: calc(env(safe-area-inset-top, 0px) + 46px) 14px 18px;
      background: rgba(18,18,18,.96); border-left: 1px solid #333; overflow-y: auto;
      transform: translateX(100%); transition: transform .22s ease;
      box-shadow: -12px 0 30px rgba(0,0,0,.45);
    }
    #drawer.open { transform: translateX(0); }
    #drawer h2 { margin: 0 0 12px; font-size: 18px; }
    .section { border-top: 1px solid #333; padding-top: 12px; margin-top: 12px; }
    label { display: block; margin: 9px 0 5px; font-size: 13px; color: #ddd; }
    select, button, input[type="range"] { width: 100%; }
    select, button {
      border: 1px solid #444; border-radius: 9px; background: #262626; color: #fff;
      padding: 10px; font-size: 14px;
    }
    button { background: #2d6cdf; border: none; font-weight: 700; cursor: pointer; }
    button.secondary { background: #444; }
    button.danger { background: #8f2d2d; }
    .row { display: grid; grid-template-columns: 1fr auto; gap: 8px; align-items: center; }
    .value { font-size: 12px; color: #bbb; min-width: 52px; text-align: right; }
    .check { display: grid; grid-template-columns: 24px 1fr; gap: 6px; align-items: center; margin: 7px 0; font-size: 13px; color: #ddd; }
    .check input { width: 18px; height: 18px; }
    .tiny { color: #aaa; font-size: 12px; line-height: 1.35; margin-top: 8px; }
    .pill { display: inline-block; padding: 2px 6px; border-radius: 999px; background: #222; border: 1px solid #444; font-size: 12px; color: #ddd; }
  </style>
</head>
<body>
  <div id="app">
    <video id="video" autoplay playsinline muted></video>
    <canvas id="canvas"></canvas>
  </div>

  <div id="status">Starting...</div>
  <button id="drawerTab" aria-label="open options">‹</button>

  <aside id="drawer">
    <h2>Tracker Options</h2>

    <div class="section">
      <label for="modeSelect">Detection mode</label>
      <select id="modeSelect">
        <option value="person">Person detection / COCO-SSD</option>
        <option value="skeleton">Skeleton pose / MoveNet</option>
      </select>

      <label for="lensToggle">Camera lens</label>
      <button id="lensToggle">Lens: Ultrawide</button>

      <label for="resolutionSelect">Resolution</label>
      <select id="resolutionSelect">
        <option value="480">480p</option>
        <option value="720" selected>720p</option>
        <option value="1080">1080p</option>
      </select>
    </div>

    <div class="section">
      <div class="row"><label for="frameStep">Detect every N frames</label><span id="frameStepValue" class="value">2</span></div>
      <input id="frameStep" type="range" min="1" max="10" value="2" />

      <div class="row"><label for="threshold">Detection threshold</label><span id="thresholdValue" class="value">0.40</span></div>
      <input id="threshold" type="range" min="0.10" max="0.90" step="0.05" value="0.40" />

      <div class="row"><label for="cropScale">Head crop size</label><span id="cropScaleValue" class="value">1.80</span></div>
      <input id="cropScale" type="range" min="1.0" max="3.0" step="0.1" value="1.8" />
    </div>

    <div class="section">
      <label>Overlays</label>
      <div class="check"><input id="showPersonBoxes" type="checkbox" checked><span>Person boxes</span></div>
      <div class="check"><input id="showConfidence" type="checkbox" checked><span>Confidence / classifier labels</span></div>
      <div class="check"><input id="showSkeleton" type="checkbox" checked><span>Skeleton lines</span></div>
      <div class="check"><input id="showKeypoints" type="checkbox" checked><span>Keypoints</span></div>
      <div class="check"><input id="showPoseLabels" type="checkbox" checked><span>Pose labels</span></div>
      <div class="check"><input id="showHeadCrops" type="checkbox" checked><span>Head crop boxes</span></div>
      <div class="check"><input id="showCropCenters" type="checkbox"><span>Crop centers</span></div>
      <div class="check"><input id="showStats" type="checkbox" checked><span>Status stats</span></div>
    </div>

    <div class="section">
      <button id="reloadCameraBtn" class="secondary">Restart camera</button>
      <button id="loadClassifierBtn" style="margin-top:8px;">Load classifier</button>
      <div class="tiny">
        Classifier path: <span class="pill">./model/model.json</span><br>
        Use this only after your TF.js model files are uploaded.
      </div>
    </div>
  </aside>

  <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@4.17.0/dist/tf.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/coco-ssd@2.2.3/dist/coco-ssd.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/pose-detection@2.1.3/dist/pose-detection.min.js"></script>

  <script>
    const video = document.getElementById('video');
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    const statusEl = document.getElementById('status');
    const drawer = document.getElementById('drawer');
    const drawerTab = document.getElementById('drawerTab');

    const modeSelect = document.getElementById('modeSelect');
    const lensToggle = document.getElementById('lensToggle');
    const resolutionSelect = document.getElementById('resolutionSelect');
    const frameStep = document.getElementById('frameStep');
    const frameStepValue = document.getElementById('frameStepValue');
    const threshold = document.getElementById('threshold');
    const thresholdValue = document.getElementById('thresholdValue');
    const cropScale = document.getElementById('cropScale');
    const cropScaleValue = document.getElementById('cropScaleValue');
    const reloadCameraBtn = document.getElementById('reloadCameraBtn');
    const loadClassifierBtn = document.getElementById('loadClassifierBtn');

    const overlay = {
      personBoxes: document.getElementById('showPersonBoxes'),
      confidence: document.getElementById('showConfidence'),
      skeleton: document.getElementById('showSkeleton'),
      keypoints: document.getElementById('showKeypoints'),
      poseLabels: document.getElementById('showPoseLabels'),
      headCrops: document.getElementById('showHeadCrops'),
      cropCenters: document.getElementById('showCropCenters'),
      stats: document.getElementById('showStats')
    };

    let stream = null;
    let personDetector = null;
    let poseDetector = null;
    let headbandModel = null;
    let isRunning = false;
    let frameCounter = 0;
    let currentLens = 'ultrawide';
    let lastResults = [];

    const EDGES = [
      ['nose','left_eye'], ['nose','right_eye'], ['left_eye','left_ear'], ['right_eye','right_ear'],
      ['left_shoulder','right_shoulder'], ['left_shoulder','left_elbow'], ['left_elbow','left_wrist'],
      ['right_shoulder','right_elbow'], ['right_elbow','right_wrist'], ['left_shoulder','left_hip'],
      ['right_shoulder','right_hip'], ['left_hip','right_hip'], ['left_hip','left_knee'],
      ['left_knee','left_ankle'], ['right_hip','right_knee'], ['right_knee','right_ankle']
    ];

    function setStatus(text, error=false) {
      statusEl.textContent = text;
      statusEl.style.background = error ? 'rgba(120,0,0,.8)' : 'rgba(0,0,0,.65)';
    }

    function syncLabels() {
      frameStepValue.textContent = frameStep.value;
      thresholdValue.textContent = Number(threshold.value).toFixed(2);
      cropScaleValue.textContent = Number(cropScale.value).toFixed(2);
      lensToggle.textContent = `Lens: ${currentLens === 'ultrawide' ? 'Ultrawide' : 'Normal'}`;
    }

    function resizeCanvas() {
      canvas.width = canvas.clientWidth || window.innerWidth;
      canvas.height = canvas.clientHeight || window.innerHeight;
    }

    function getCoverDimensions() {
      const screenW = canvas.width, screenH = canvas.height;
      const videoW = video.videoWidth || 16, videoH = video.videoHeight || 9;
      const screenRatio = screenW / screenH;
      const videoRatio = videoW / videoH;
      let drawW, drawH, offsetX, offsetY;
      if (screenRatio > videoRatio) {
        drawW = screenW; drawH = screenW / videoRatio; offsetX = 0; offsetY = (screenH - drawH) / 2;
      } else {
        drawH = screenH; drawW = screenH * videoRatio; offsetX = (screenW - drawW) / 2; offsetY = 0;
      }
      return { drawW, drawH, offsetX, offsetY, scaleX: drawW / videoW, scaleY: drawH / videoH };
    }

    function clampRect(r) {
      const maxW = video.videoWidth, maxH = video.videoHeight;
      const x = Math.max(0, Math.min(r.x, maxW - 1));
      const y = Math.max(0, Math.min(r.y, maxH - 1));
      const w = Math.max(1, Math.min(r.w, maxW - x));
      const h = Math.max(1, Math.min(r.h, maxH - y));
      return { x, y, w, h };
    }

    function personHeadRect(bbox) {
      const [x, y, w, h] = bbox;
      const cropH = h * 0.30;
      const scale = Number(cropScale.value);
      const side = Math.max(w * 0.72, cropH) * scale;
      return clampRect({ x: x + w / 2 - side / 2, y: y + h * 0.02, w: side, h: side });
    }

    function kpMap(pose) {
      const m = {};
      for (const kp of pose.keypoints || []) m[kp.name] = kp;
      return m;
    }

    function goodKp(kp) { return kp && (kp.score == null || kp.score >= 0.25); }

    function skeletonHeadRect(pose) {
      const k = kpMap(pose);
      const head = [k.nose, k.left_eye, k.right_eye, k.left_ear, k.right_ear].filter(goodKp);
      if (!head.length) return null;
      const shoulders = [k.left_shoulder, k.right_shoulder].filter(goodKp);
      const xs = head.map(p => p.x), ys = head.map(p => p.y);
      const minX = Math.min(...xs), maxX = Math.max(...xs);
      const minY = Math.min(...ys), maxY = Math.max(...ys);
      const shoulderWidth = shoulders.length === 2 ? Math.abs(shoulders[0].x - shoulders[1].x) : 0;
      const faceWidth = Math.max(maxX - minX, shoulderWidth * 0.34, 32);
      const side = faceWidth * Number(cropScale.value);
      const cx = (minX + maxX) / 2;
      const cy = (minY + maxY) / 2 + side * 0.08;
      return clampRect({ x: cx - side / 2, y: cy - side / 2, w: side, h: side });
    }

    async function classifyRect(rect) {
      if (!headbandModel) return null;
      try {
        return tf.tidy(() => {
          const pixels = tf.browser.fromPixels(video);
          const box = [rect.y / video.videoHeight, rect.x / video.videoWidth, (rect.y + rect.h) / video.videoHeight, (rect.x + rect.w) / video.videoWidth];
          const crop = tf.image.cropAndResize(pixels.expandDims(0), [box], [0], [224, 224]);
          const out = headbandModel.predict(crop);
          return out.dataSync();
        });
      } catch (e) {
        console.warn('classifier error', e);
        return null;
      }
    }

    function drawBox(rect, color, label) {
      const d = getCoverDimensions();
      const x = rect.x * d.scaleX + d.offsetX;
      const y = rect.y * d.scaleY + d.offsetY;
      const w = rect.w * d.scaleX;
      const h = rect.h * d.scaleY;
      ctx.strokeStyle = color;
      ctx.lineWidth = 2;
      ctx.strokeRect(x, y, w, h);
      if (label && overlay.confidence.checked) {
        ctx.fillStyle = color;
        ctx.font = '14px Arial';
        ctx.fillText(label, x + 4, Math.max(16, y - 6));
      }
      if (overlay.cropCenters.checked) {
        ctx.fillStyle = color;
        ctx.beginPath();
        ctx.arc(x + w / 2, y + h / 2, 4, 0, Math.PI * 2);
        ctx.fill();
      }
    }

    function drawSkeleton(pose, idx) {
      const d = getCoverDimensions();
      const k = kpMap(pose);
      if (overlay.skeleton.checked) {
        ctx.strokeStyle = 'lime'; ctx.lineWidth = 2;
        for (const [a,b] of EDGES) {
          if (!goodKp(k[a]) || !goodKp(k[b])) continue;
          ctx.beginPath();
          ctx.moveTo(k[a].x * d.scaleX + d.offsetX, k[a].y * d.scaleY + d.offsetY);
          ctx.lineTo(k[b].x * d.scaleX + d.offsetX, k[b].y * d.scaleY + d.offsetY);
          ctx.stroke();
        }
      }
      if (overlay.keypoints.checked) {
        for (const kp of pose.keypoints || []) {
          if (!goodKp(kp)) continue;
          ctx.fillStyle = ['nose','left_eye','right_eye','left_ear','right_ear'].includes(kp.name) ? 'red' : 'lime';
          ctx.beginPath();
          ctx.arc(kp.x * d.scaleX + d.offsetX, kp.y * d.scaleY + d.offsetY, 3, 0, Math.PI * 2);
          ctx.fill();
        }
      }
      if (overlay.poseLabels.checked && goodKp(k.nose)) {
        ctx.fillStyle = 'white'; ctx.font = '14px Arial';
        ctx.fillText(`Pose ${idx + 1}`, k.nose.x * d.scaleX + d.offsetX + 5, k.nose.y * d.scaleY + d.offsetY - 10);
      }
    }

    async function drawResults(results) {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      for (const item of results) {
        const pred = item.pred;
        let color = 'yellow';
        let label = item.label || '';
        if (pred) {
          const headband = pred[0];
          const noHeadband = pred[1];
          const isHeadband = headband >= noHeadband;
          color = isHeadband ? 'cyan' : 'yellow';
          label = `${isHeadband ? 'headband' : 'no_headband'} ${Math.round(Math.max(headband, noHeadband) * 100)}%`;
        }
        if (item.personRect && overlay.personBoxes.checked) drawBox(item.personRect, 'lime', item.personLabel);
        if (item.pose) drawSkeleton(item.pose, item.index || 0);
        if (item.headRect && overlay.headCrops.checked) drawBox(item.headRect, color, label);
      }
    }

    async function runDetection() {
      if (!isRunning || video.readyState < 2) return;
      frameCounter++;
      const every = Math.max(1, Number(frameStep.value));
      if (frameCounter % every !== 0) {
        await drawResults(lastResults);
        requestAnimationFrame(runDetection);
        return;
      }

      try {
        const mode = modeSelect.value;
        const results = [];
        if (mode === 'person') {
          if (!personDetector) personDetector = await cocoSsd.load({ base: 'mobilenet_v2' });
          const preds = await personDetector.detect(video);
          const people = preds.filter(p => p.class === 'person' && p.score >= Number(threshold.value));
          for (const p of people) {
            const headRect = personHeadRect(p.bbox);
            const pred = await classifyRect(headRect);
            results.push({ personRect: { x:p.bbox[0], y:p.bbox[1], w:p.bbox[2], h:p.bbox[3] }, personLabel: `${Math.round(p.score * 100)}%`, headRect, pred });
          }
          if (overlay.stats.checked) setStatus(`Person mode: ${people.length} people | every ${every} frame(s) | ${resolutionSelect.value}p`);
        } else {
          if (!poseDetector) {
            poseDetector = await poseDetection.createDetector(
              poseDetection.SupportedModels.MoveNet,
              { modelType: poseDetection.movenet.modelType.MULTIPOSE_LIGHTNING }
            );
          }
          const posesRaw = await poseDetector.estimatePoses(video, { maxPoses: 20, flipHorizontal: false });
          const poses = posesRaw.filter(p => (p.score == null || p.score >= Number(threshold.value)) && skeletonHeadRect(p));
          for (let i = 0; i < poses.length; i++) {
            const headRect = skeletonHeadRect(poses[i]);
            const pred = await classifyRect(headRect);
            results.push({ pose: poses[i], index: i, headRect, pred });
          }
          if (overlay.stats.checked) setStatus(`Skeleton mode: ${poses.length} poses | every ${every} frame(s) | ${resolutionSelect.value}p`);
        }
        lastResults = results;
        await drawResults(results);
      } catch (err) {
        console.error(err);
        setStatus('Detection error: ' + err.message, true);
      }
      requestAnimationFrame(runDetection);
    }

    async function startCamera() {
      isRunning = false;
      if (stream) stream.getTracks().forEach(t => t.stop());
      stream = null;
      ctx.clearRect(0,0,canvas.width,canvas.height);
      const h = Number(resolutionSelect.value);
      const w = Math.round(h * 16 / 9);
      setStatus('Starting camera...');
      try {
        stream = await navigator.mediaDevices.getUserMedia({
          audio: false,
          video: { facingMode: 'environment', width: { ideal: w }, height: { ideal: h } }
        });
        video.srcObject = stream;
        await new Promise(resolve => video.onloadedmetadata = resolve);
        await video.play();
        if (currentLens === 'ultrawide') {
          const track = stream.getVideoTracks()[0];
          const cap = track.getCapabilities ? track.getCapabilities() : {};
          if (cap.zoom) await track.applyConstraints({ advanced: [{ zoom: cap.zoom.min }] });
        }
        resizeCanvas();
        isRunning = true;
        frameCounter = 0;
        setStatus('Camera running. Loading detector on first frame...');
        requestAnimationFrame(runDetection);
      } catch (err) {
        setStatus('Camera error: ' + err.message, true);
      }
    }

    async function init() {
      syncLabels();
      resizeCanvas();
      try { await tf.setBackend('webgl'); await tf.ready(); } catch(e) { console.warn(e); }
      await startCamera();
    }

    drawerTab.addEventListener('click', () => {
      drawer.classList.toggle('open');
      drawerTab.textContent = drawer.classList.contains('open') ? '›' : '‹';
    });

    lensToggle.addEventListener('click', async () => {
      currentLens = currentLens === 'ultrawide' ? 'normal' : 'ultrawide';
      syncLabels();
      await startCamera();
    });

    resolutionSelect.addEventListener('change', startCamera);
    reloadCameraBtn.addEventListener('click', startCamera);
    frameStep.addEventListener('input', syncLabels);
    threshold.addEventListener('input', syncLabels);
    cropScale.addEventListener('input', syncLabels);
    modeSelect.addEventListener('change', () => { lastResults = []; setStatus('Switched detection mode. Loading detector on next frame...'); });
    window.addEventListener('resize', resizeCanvas);

    loadClassifierBtn.addEventListener('click', async () => {
      loadClassifierBtn.disabled = true;
      setStatus('Loading classifier from ./model/model.json...');
      try {
        headbandModel = await tf.loadLayersModel('./model/model.json');
        setStatus('Classifier loaded. Predictions will appear on head crops.');
      } catch (err) {
        console.error(err);
        setStatus('Classifier load failed: ' + err.message, true);
        loadClassifierBtn.disabled = false;
      }
    });

    init();
  </script>
</body>
</html>
