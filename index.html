<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Headband Tracker</title>
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: #000; font-family: Arial, sans-serif; color: #fff; }
    .app { position: fixed; inset: 0; overflow: hidden; background: #000; }
    video, canvas { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
    #status {
      position: fixed; top: env(safe-area-inset-top, 0); left: 0; right: 0; z-index: 20;
      padding: 8px 48px 8px 10px; background: rgba(0,0,0,0.65); color: #fff;
      font-size: 13px; text-align: center; min-height: 32px;
    }
    #drawerTab {
      position: fixed; right: 0; top: 50%; transform: translateY(-50%); z-index: 31;
      width: 30px; height: 70px; border-radius: 12px 0 0 12px; border: 1px solid rgba(255,255,255,0.25); border-right: 0;
      background: rgba(45,108,223,0.95); color: white; font-size: 24px; font-weight: 700;
      display: flex; align-items: center; justify-content: center;
    }
    #drawer {
      position: fixed; top: 0; right: 0; bottom: 0; z-index: 30;
      width: min(330px, 88vw); padding: calc(env(safe-area-inset-top, 0) + 14px) 14px calc(env(safe-area-inset-bottom, 0) + 14px);
      background: rgba(20,20,20,0.96); border-left: 1px solid rgba(255,255,255,0.15);
      transform: translateX(100%); transition: transform 180ms ease; overflow-y: auto;
    }
    #drawer.open { transform: translateX(0); }
    #drawer.open + #drawerTab { right: min(330px, 88vw); }
    h2 { font-size: 17px; margin: 0 0 12px; }
    .group { border-top: 1px solid rgba(255,255,255,0.15); padding-top: 12px; margin-top: 12px; }
    label { display: block; font-size: 12px; color: #ccc; margin: 0 0 5px; }
    select, button, input[type="range"] { width: 100%; }
    select, button {
      padding: 10px; border: 1px solid #444; border-radius: 9px; background: #272727; color: white; font-size: 14px;
    }
    button { background: #2d6cdf; font-weight: 700; border: 0; }
    .row { display: grid; grid-template-columns: 1fr auto; gap: 8px; align-items: center; margin: 10px 0; }
    .checkrow { display: flex; gap: 8px; align-items: center; margin: 8px 0; font-size: 13px; color: #ddd; }
    .checkrow input { width: auto; }
    .value { font-size: 13px; color: #ddd; min-width: 46px; text-align: right; }
    .hint { font-size: 12px; color: #aaa; line-height: 1.35; margin-top: 8px; }
    .pill { display: inline-block; padding: 2px 7px; border-radius: 999px; background: #333; font-size: 12px; color: #ddd; }
  </style>
</head>
<body>
  <div class="app">
    <video id="video" autoplay playsinline muted></video>
    <canvas id="canvas"></canvas>
  </div>
  <div id="status">Starting...</div>

  <aside id="drawer">
    <h2>Headband Tracker</h2>

    <div>
      <label for="detectionMode">Detection mode</label>
      <select id="detectionMode">
        <option value="person">Person detection boxes</option>
        <option value="skeleton">Skeleton pose detection</option>
      </select>
    </div>

    <div class="group">
      <label>Camera lens</label>
      <button id="lensToggle">Lens: Ultrawide</button>
      <div class="hint">Ultrawide uses the smallest available zoom when supported.</div>
    </div>

    <div class="group">
      <label for="resolutionSlider">Resolution</label>
      <div class="row"><input id="resolutionSlider" type="range" min="0" max="2" value="1" step="1"><div id="resolutionValue" class="value">720p</div></div>
      <label for="detectEvery">Detect every N frames</label>
      <div class="row"><input id="detectEvery" type="range" min="1" max="10" value="2" step="1"><div id="detectEveryValue" class="value">2</div></div>
    </div>

    <div class="group">
      <label>Classifier</label>
      <div class="checkrow"><input id="enableClassifier" type="checkbox" checked> <span>Run headband model</span></div>
      <label for="thresholdSlider">Headband threshold</label>
      <div class="row"><input id="thresholdSlider" type="range" min="0.05" max="0.95" value="0.65" step="0.05"><div id="thresholdValue" class="value">0.65</div></div>
      <div class="hint">Model path: <span class="pill">./model/model.json</span></div>
      <button id="retryModelBtn" class="secondary" style="margin-top:8px;">Retry model load</button>
      <div id="modelStatus" class="hint">Model status: not loaded</div>
    </div>

    <div class="group">
      <label>Overlays</label>
      <div class="checkrow"><input id="showPersonBoxes" type="checkbox" checked> <span>Person boxes</span></div>
      <div class="checkrow"><input id="showHeadBoxes" type="checkbox" checked> <span>Head crop boxes</span></div>
      <div class="checkrow"><input id="showLabels" type="checkbox" checked> <span>Prediction labels</span></div>
      <div class="checkrow"><input id="showSkeleton" type="checkbox" checked> <span>Skeleton/keypoints</span></div>
      <div class="checkrow"><input id="showCenters" type="checkbox"> <span>Crop centers</span></div>
      <div class="checkrow"><input id="showDebug" type="checkbox" checked> <span>Status/debug text</span></div>
    </div>

    <div class="group">
      <button id="restartBtn">Restart camera</button>
    </div>
  </aside>
  <button id="drawerTab" aria-label="Open options">‹</button>

  <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@4.17.0/dist/tf.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/coco-ssd@2.2.3/dist/coco-ssd.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/pose-detection@2.1.3/dist/pose-detection.min.js"></script>

  <script>
    const video = document.getElementById('video');
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    const statusEl = document.getElementById('status');
    const drawer = document.getElementById('drawer');
    const drawerTab = document.getElementById('drawerTab');

    const detectionMode = document.getElementById('detectionMode');
    const lensToggle = document.getElementById('lensToggle');
    const resolutionSlider = document.getElementById('resolutionSlider');
    const resolutionValue = document.getElementById('resolutionValue');
    const detectEvery = document.getElementById('detectEvery');
    const detectEveryValue = document.getElementById('detectEveryValue');
    const enableClassifier = document.getElementById('enableClassifier');
    const retryModelBtn = document.getElementById('retryModelBtn');
    const modelStatus = document.getElementById('modelStatus');
    const thresholdSlider = document.getElementById('thresholdSlider');
    const thresholdValue = document.getElementById('thresholdValue');
    const showPersonBoxes = document.getElementById('showPersonBoxes');
    const showHeadBoxes = document.getElementById('showHeadBoxes');
    const showLabels = document.getElementById('showLabels');
    const showSkeleton = document.getElementById('showSkeleton');
    const showCenters = document.getElementById('showCenters');
    const showDebug = document.getElementById('showDebug');
    const restartBtn = document.getElementById('restartBtn');

    let currentStream = null;
    let personDetector = null;
    let poseDetector = null;
    let headbandModel = null;
    let isRunning = false;
    let currentLens = 'ultrawide';
    let frameIndex = 0;
    let lastDetections = [];
    let busy = false;
    let lastFpsTime = performance.now();
    let fpsFrames = 0;
    let fps = 0;
    let modelClassNames = ['headband', 'no_headband'];
    let modelLoadState = 'not-loaded';
    let modelLoadError = '';

    const resolutionMap = [
      { label: '480p', width: 854, height: 480 },
      { label: '720p', width: 1280, height: 720 },
      { label: '1080p', width: 1920, height: 1080 }
    ];

    function status(text, error = false) {
      if (!showDebug.checked && !error) { statusEl.style.display = 'none'; return; }
      statusEl.style.display = 'block';
      statusEl.textContent = text;
      statusEl.style.background = error ? 'rgba(120,0,0,0.85)' : 'rgba(0,0,0,0.65)';
    }

    function resizeCanvas() {
      canvas.width = canvas.offsetWidth;
      canvas.height = canvas.offsetHeight;
    }

    function getCoverDimensions() {
      const screenW = canvas.width, screenH = canvas.height;
      const videoW = video.videoWidth || 16, videoH = video.videoHeight || 9;
      const screenRatio = screenW / screenH, videoRatio = videoW / videoH;
      let drawW, drawH, offsetX, offsetY;
      if (screenRatio > videoRatio) {
        drawW = screenW; drawH = screenW / videoRatio; offsetX = 0; offsetY = (screenH - drawH) / 2;
      } else {
        drawH = screenH; drawW = screenH * videoRatio; offsetX = (screenW - drawW) / 2; offsetY = 0;
      }
      return { drawW, drawH, offsetX, offsetY, scaleX: drawW / videoW, scaleY: drawH / videoH };
    }

    function toScreenRect(rect) {
      const d = getCoverDimensions();
      return { x: rect.x * d.scaleX + d.offsetX, y: rect.y * d.scaleY + d.offsetY, w: rect.w * d.scaleX, h: rect.h * d.scaleY };
    }

    function clampRect(x, y, w, h) {
      const maxW = video.videoWidth || 1, maxH = video.videoHeight || 1;
      const nx = Math.max(0, Math.min(x, maxW - 1));
      const ny = Math.max(0, Math.min(y, maxH - 1));
      const nw = Math.max(1, Math.min(w, maxW - nx));
      const nh = Math.max(1, Math.min(h, maxH - ny));
      return { x: nx, y: ny, w: nw, h: nh };
    }

    function personHeadRect(bbox) {
      const [x, y, w, h] = bbox;
      const headH = h * 0.28;
      const padX = w * 0.08;
      const padTop = h * 0.03;
      return clampRect(x - padX, y + padTop, w + padX * 2, headH);
    }

    function kpMap(pose) {
      const out = {};
      for (const kp of pose.keypoints || []) out[kp.name] = kp;
      return out;
    }

    function goodKp(kp, min = 0.25) {
      return kp && (kp.score == null || kp.score >= min);
    }

    function skeletonHeadRect(pose) {
      const k = kpMap(pose);
      const head = [k.nose, k.left_eye, k.right_eye, k.left_ear, k.right_ear].filter(p => goodKp(p));
      const shoulders = [k.left_shoulder, k.right_shoulder].filter(p => goodKp(p));
      if (!head.length) return null;
      const xs = head.map(p => p.x), ys = head.map(p => p.y);
      let minX = Math.min(...xs), maxX = Math.max(...xs), minY = Math.min(...ys), maxY = Math.max(...ys);
      const shoulderW = shoulders.length === 2 ? Math.abs(shoulders[0].x - shoulders[1].x) : 0;
      const faceW = Math.max(maxX - minX, shoulderW * 0.33, 32);
      const size = faceW * 1.9;
      const cx = (minX + maxX) / 2;
      const cy = (minY + maxY) / 2 + size * 0.08;
      return clampRect(cx - size / 2, cy - size / 2, size, size);
    }

    function setModelStatus(text) {
      if (modelStatus) modelStatus.textContent = 'Model status: ' + text;
    }

    async function classifyHead(rect) {
      if (!enableClassifier.checked) return { state: 'disabled' };
      if (modelLoadState === 'loading') return { state: 'loading' };
      if (!headbandModel || modelLoadState !== 'loaded') return { state: 'not-loaded' };

      const x = Math.max(0, Math.floor(rect.x));
      const y = Math.max(0, Math.floor(rect.y));
      const w = Math.max(1, Math.floor(rect.w));
      const h = Math.max(1, Math.floor(rect.h));

      const probs = tf.tidy(() => {
        const input = tf.browser.fromPixels(video)
          .slice([y, x, 0], [h, w, 3])
          .resizeBilinear([224, 224])
          .expandDims(0);
        const pred = headbandModel.predict(input);
        return Array.from(pred.dataSync());
      });

      return { state: 'ok', probs };
    }

    function classifyLabel(classification) {
      if (!classification || classification.state !== 'ok') {
        const state = classification ? classification.state : 'not-loaded';
        const labelMap = {
          'disabled': 'model off',
          'loading': 'model loading',
          'not-loaded': 'model not loaded'
        };
        return { label: labelMap[state] || 'model error', score: 0, headbandScore: 0, systemLabel: true };
      }

      const probs = classification.probs;
      let headbandIdx = modelClassNames.indexOf('headband');
      if (headbandIdx < 0) headbandIdx = 0;
      const hb = Number(probs[headbandIdx] || 0);
      const threshold = Number(thresholdSlider.value);
      return { label: hb >= threshold ? 'headband' : 'no_headband', score: hb, headbandScore: hb, systemLabel: false };
    }

    function drawText(text, x, y, bg = 'rgba(0,0,0,0.65)', color = '#fff') {
      ctx.font = '14px Arial';
      const pad = 4;
      const m = ctx.measureText(text);
      ctx.fillStyle = bg;
      ctx.fillRect(x, y - 16, m.width + pad * 2, 20);
      ctx.fillStyle = color;
      ctx.fillText(text, x + pad, y - 2);
    }

    function drawSkeleton(pose) {
      const pairs = poseDetection.util.getAdjacentPairs(poseDetection.SupportedModels.MoveNet);
      const d = getCoverDimensions();
      ctx.lineWidth = 2;
      ctx.strokeStyle = 'rgba(0,255,0,0.85)';
      for (const [i, j] of pairs) {
        const a = pose.keypoints[i], b = pose.keypoints[j];
        if (!goodKp(a) || !goodKp(b)) continue;
        ctx.beginPath();
        ctx.moveTo(a.x * d.scaleX + d.offsetX, a.y * d.scaleY + d.offsetY);
        ctx.lineTo(b.x * d.scaleX + d.offsetX, b.y * d.scaleY + d.offsetY);
        ctx.stroke();
      }
      for (const kp of pose.keypoints || []) {
        if (!goodKp(kp)) continue;
        ctx.fillStyle = ['nose','left_eye','right_eye','left_ear','right_ear'].includes(kp.name) ? 'red' : 'lime';
        ctx.beginPath();
        ctx.arc(kp.x * d.scaleX + d.offsetX, kp.y * d.scaleY + d.offsetY, 3, 0, Math.PI * 2);
        ctx.fill();
      }
    }

    function drawDetections(items) {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      const d = getCoverDimensions();
      for (const item of items) {
        const isHeadband = item.result && item.result.label === 'headband';
        const color = isHeadband ? '#00ff66' : '#ffd400';
        if (item.type === 'person' && showPersonBoxes.checked && item.personRect) {
          const r = toScreenRect(item.personRect);
          ctx.strokeStyle = 'rgba(0,255,0,0.85)'; ctx.lineWidth = 2; ctx.strokeRect(r.x, r.y, r.w, r.h);
        }
        if (item.type === 'pose' && showSkeleton.checked && item.pose) drawSkeleton(item.pose);
        if (showHeadBoxes.checked && item.headRect) {
          const r = toScreenRect(item.headRect);
          ctx.strokeStyle = color; ctx.lineWidth = isHeadband ? 4 : 2; ctx.strokeRect(r.x, r.y, r.w, r.h);
          if (showCenters.checked) {
            ctx.fillStyle = color; ctx.beginPath(); ctx.arc(r.x + r.w / 2, r.y + r.h / 2, 4, 0, Math.PI * 2); ctx.fill();
          }
          if (showLabels.checked) {
            const text = item.result ? (item.result.systemLabel ? item.result.label : `${item.result.label} ${(item.result.headbandScore * 100).toFixed(0)}%`) : 'no model';
            drawText(text, r.x, Math.max(18, r.y - 4), isHeadband ? 'rgba(0,120,40,0.85)' : 'rgba(0,0,0,0.65)');
          }
        }
      }
    }

    async function detectPersonMode() {
      const predictions = await personDetector.detect(video);
      const people = predictions.filter(p => p.class === 'person' && p.score > 0.4);
      const items = [];
      for (const p of people) {
        const [x, y, w, h] = p.bbox;
        const headRect = personHeadRect(p.bbox);
        let result = null;
        try { result = classifyLabel(await classifyHead(headRect)); } catch (e) { result = { label: 'model error', score: 0, headbandScore: 0 }; }
        items.push({ type: 'person', personRect: { x, y, w, h }, headRect, result, score: p.score });
      }
      return items;
    }

    async function detectSkeletonMode() {
      const posesRaw = await poseDetector.estimatePoses(video, { maxPoses: 20, flipHorizontal: false });
      const poses = posesRaw.filter(p => p.score == null || p.score >= 0.18);
      const items = [];
      for (const pose of poses) {
        const headRect = skeletonHeadRect(pose);
        if (!headRect) continue;
        let result = null;
        try { result = classifyLabel(await classifyHead(headRect)); } catch (e) { result = { label: 'model error', score: 0, headbandScore: 0 }; }
        items.push({ type: 'pose', pose, headRect, result, score: pose.score || 0 });
      }
      return items;
    }

    async function loop() {
      if (!isRunning) return;
      requestAnimationFrame(loop);
      if (busy || video.readyState < 2) return;
      frameIndex++;
      fpsFrames++;
      const now = performance.now();
      if (now - lastFpsTime > 1000) { fps = fpsFrames; fpsFrames = 0; lastFpsTime = now; }
      const every = Math.max(1, Number(detectEvery.value));
      if (frameIndex % every !== 0) { drawDetections(lastDetections); return; }
      busy = true;
      try {
        if (detectionMode.value === 'person') lastDetections = await detectPersonMode();
        else lastDetections = await detectSkeletonMode();
        drawDetections(lastDetections);
        const hb = lastDetections.filter(d => d.result && d.result.label === 'headband').length;
        status(`${detectionMode.value} | ${lastDetections.length} targets | ${hb} headband | ${fps} fps | model ${headbandModel ? 'on' : 'off'}`);
      } catch (err) {
        status('Detection error: ' + err.message, true);
      } finally {
        busy = false;
      }
    }

    async function startCamera() {
      isRunning = false;
      if (currentStream) currentStream.getTracks().forEach(t => t.stop());
      const res = resolutionMap[Number(resolutionSlider.value)];
      resolutionValue.textContent = res.label;
      lensToggle.textContent = 'Lens: ' + (currentLens === 'ultrawide' ? 'Ultrawide' : 'Normal');
      status('Starting camera...');
      const stream = await navigator.mediaDevices.getUserMedia({
        audio: false,
        video: { facingMode: 'environment', width: { ideal: res.width }, height: { ideal: res.height } }
      });
      currentStream = stream;
      video.srcObject = stream;
      await new Promise(resolve => video.onloadedmetadata = resolve);
      await video.play();
      resizeCanvas();
      if (currentLens === 'ultrawide') {
        const track = stream.getVideoTracks()[0];
        const caps = track.getCapabilities ? track.getCapabilities() : {};
        if (caps.zoom) {
          try { await track.applyConstraints({ advanced: [{ zoom: caps.zoom.min }] }); } catch (e) {}
        }
      }
      isRunning = true;
      loop();
    }

    async function loadHeadbandModel() {
      modelLoadState = 'loading';
      modelLoadError = '';
      setModelStatus('loading ./model/model.json');
      status('Loading headband classifier...');
      try {
        headbandModel = await tf.loadLayersModel('./model/model.json?cacheBust=' + Date.now());
        const test = tf.tidy(() => {
          const zeros = tf.zeros([1, 224, 224, 3]);
          const pred = headbandModel.predict(zeros);
          return Array.from(pred.dataSync());
        });
        modelLoadState = 'loaded';
        enableClassifier.checked = true;
        setModelStatus('loaded; test output [' + test.map(v => v.toFixed(3)).join(', ') + ']');
        console.log('Headband model loaded', headbandModel.inputs, headbandModel.outputs, test);
      } catch (err) {
        headbandModel = null;
        modelLoadState = 'failed';
        modelLoadError = err.message || String(err);
        enableClassifier.checked = false;
        setModelStatus('failed - ' + modelLoadError);
        status('Headband model failed to load. Detection still works: ' + modelLoadError, true);
        await new Promise(r => setTimeout(r, 1500));
      }
    }

    async function loadAllModels() {
      status('Loading TensorFlow backend...');
      await tf.setBackend('webgl');
      await tf.ready();

      status('Loading COCO person detector...');
      personDetector = await cocoSsd.load({ base: 'mobilenet_v2' });

      status('Loading MoveNet skeleton detector...');
      poseDetector = await poseDetection.createDetector(
        poseDetection.SupportedModels.MoveNet,
        { modelType: poseDetection.movenet.modelType.MULTIPOSE_LIGHTNING }
      );

      await loadHeadbandModel();
    }

    drawerTab.addEventListener('click', () => {
      drawer.classList.toggle('open');
      drawerTab.textContent = drawer.classList.contains('open') ? '›' : '‹';
    });
    lensToggle.addEventListener('click', async () => {
      currentLens = currentLens === 'ultrawide' ? 'normal' : 'ultrawide';
      await startCamera();
    });
    resolutionSlider.addEventListener('input', () => { resolutionValue.textContent = resolutionMap[Number(resolutionSlider.value)].label; });
    resolutionSlider.addEventListener('change', startCamera);
    detectEvery.addEventListener('input', () => { detectEveryValue.textContent = detectEvery.value; });
    thresholdSlider.addEventListener('input', () => { thresholdValue.textContent = Number(thresholdSlider.value).toFixed(2); });
    retryModelBtn.addEventListener('click', loadHeadbandModel);
    restartBtn.addEventListener('click', startCamera);
    showDebug.addEventListener('change', () => status('Debug display changed.'));
    window.addEventListener('resize', resizeCanvas);

    async function setup() {
      try {
        resizeCanvas();
        detectEveryValue.textContent = detectEvery.value;
        thresholdValue.textContent = Number(thresholdSlider.value).toFixed(2);
        resolutionValue.textContent = resolutionMap[Number(resolutionSlider.value)].label;
        await loadAllModels();
        await startCamera();
      } catch (err) {
        status('Setup error: ' + err.message, true);
      }
    }

    setup();
  </script>
</body>
</html>
