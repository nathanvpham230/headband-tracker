<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Headband Tracker</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #000; width: 100vw; height: 100vh; overflow: hidden; }
    .container { position: relative; width: 100%; height: 100%; }
    video { position: absolute; top: 0; left: 0; width: 100%; height: 100%; object-fit: cover; }
    canvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; }
    #status {
      color: white; font-family: sans-serif; font-size: 14px;
      padding: 8px 12px; position: fixed; top: 0; left: 0;
      background: rgba(0,0,0,0.7); width: 100%; text-align: center; z-index: 10;
    }
    #controls {
      position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%);
      display: flex; gap: 12px; z-index: 10;
    }
    .btn {
      padding: 10px 20px; border: 2px solid white; border-radius: 20px;
      background: rgba(0,0,0,0.6); color: white; font-family: sans-serif;
      font-size: 14px; cursor: pointer; transition: all 0.2s;
    }
    .btn.active { background: white; color: black; }
  </style>
</head>
<body>
  <div id="status">Starting camera...</div>
  <div class="container">
    <video id="video" autoplay playsinline></video>
    <canvas id="canvas"></canvas>
  </div>
  <div id="controls">
    <button class="btn active" id="btn-normal" onclick="switchLens('normal')">Normal</button>
    <button class="btn" id="btn-ultrawide" onclick="switchLens('ultrawide')">Ultrawide</button>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs"></script>
  <script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/pose-detection"></script>
  <script>
    const video = document.getElementById('video');
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    const status = document.getElementById('status');

    let currentLens = 'normal';
    let detector = null;
    let currentStream = null;

    function resizeCanvas() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resizeCanvas);
    window.addEventListener('orientationchange', resizeCanvas);
    resizeCanvas();

    async function startCamera(lens) {
      if (currentStream) {
        currentStream.getTracks().forEach(t => t.stop());
      }

      const constraints = {
        audio: false,
        video: lens === 'ultrawide'
          ? { facingMode: 'environment', width: { ideal: 1280 }, height: { ideal: 720 }, zoom: 0.5 }
          : { facingMode: 'environment', width: { ideal: 1280 }, height: { ideal: 720 } }
      };

      try {
        const stream = await navigator.mediaDevices.getUserMedia(constraints);
        currentStream = stream;
        video.srcObject = stream;
        await new Promise(resolve => video.onloadedmetadata = resolve);
        resizeCanvas();

        if (lens === 'ultrawide') {
          const track = stream.getVideoTracks()[0];
          const capabilities = track.getCapabilities();
          if (capabilities.zoom) {
            await track.applyConstraints({ advanced: [{ zoom: capabilities.zoom.min }] });
            status.textContent = 'Ultrawide lens active';
          } else {
            status.textContent = 'Ultrawide not supported, using wide angle';
          }
        } else {
          status.textContent = 'Running! Point camera at a person.';
        }

      } catch (err) {
        status.textContent = 'Camera error: ' + err.message;
        status.style.background = 'red';
      }
    }

    async function switchLens(lens) {
      currentLens = lens;
      document.getElementById('btn-normal').classList.toggle('active', lens === 'normal');
      document.getElementById('btn-ultrawide').classList.toggle('active', lens === 'ultrawide');
      status.textContent = 'Switching lens...';
      await startCamera(lens);
    }

    async function setup() {
      try {
        status.textContent = 'Requesting camera...';
        await startCamera('normal');

        status.textContent = 'Loading MoveNet model...';
        detector = await poseDetection.createDetector(
          poseDetection.SupportedModels.MoveNet,
          { modelType: poseDetection.movenet.modelType.SINGLEPOSE_LIGHTNING }
        );

        status.textContent = 'Running! Point camera at a person.';
        detect();

      } catch (err) {
        status.textContent = 'Error: ' + err.message;
        status.style.background = 'red';
      }
    }

    async function detect() {
      if (detector) {
        const poses = await detector.estimatePoses(video);
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
        for (const pose of poses) {
          drawSkeleton(pose.keypoints);
        }
      }
      requestAnimationFrame(detect);
    }

    function drawSkeleton(keypoints) {
      const scaleX = canvas.width / video.videoWidth;
      const scaleY = canvas.height / video.videoHeight;

      for (const kp of keypoints) {
        if (kp.score > 0.3) {
          ctx.beginPath();
          ctx.arc(kp.x * scaleX, kp.y * scaleY, 6, 0, 2 * Math.PI);
          ctx.fillStyle = kp.name === 'nose' || kp.name.includes('eye') || kp.name.includes('ear') ? 'red' : 'lime';
          ctx.fill();
        }
      }

      const connections = [
        ['left_shoulder', 'right_shoulder'],
        ['left_shoulder', 'left_elbow'], ['left_elbow', 'left_wrist'],
        ['right_shoulder', 'right_elbow'], ['right_elbow', 'right_wrist'],
        ['left_shoulder', 'left_hip'], ['right_shoulder', 'right_hip'],
        ['left_hip', 'right_hip'],
        ['left_hip', 'left_knee'], ['left_knee', 'left_ankle'],
        ['right_hip', 'right_knee'], ['right_knee', 'right_ankle']
      ];

      const kpMap = {};
      for (const kp of keypoints) kpMap[kp.name] = kp;

      ctx.strokeStyle = 'lime';
      ctx.lineWidth = 2;
      for (const [a, b] of connections) {
        const kpA = kpMap[a], kpB = kpMap[b];
        if (kpA?.score > 0.3 && kpB?.score > 0.3) {
          ctx.beginPath();
          ctx.moveTo(kpA.x * scaleX, kpA.y * scaleY);
          ctx.lineTo(kpB.x * scaleX, kpB.y * scaleY);
          ctx.stroke();
        }
      }
    }

    setup();
  </script>
</body>
</html>
